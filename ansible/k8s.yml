---
- hosts: all
  become: yes
  tasks:
    # --- General OS Updates and Preparation ---

    - name: update APT packages
      ansible.builtin.apt:
        update_cache: yes

    - name: reboot and wait for reboot to complete
      # ⚠️ This conditional skips the reboot if the host is 'localhost'
      when: inventory_hostname != 'localhost'
      ansible.builtin.reboot:

    # --- Kubeadm/Containerd Preparation ---

    - name: disable SWAP (Kubeadm requirement)
      ansible.builtin.shell: |
        swapoff -a

    - name: disable SWAP in fstab (Kubeadm requirement)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: create an empty file for the Containerd module
      ansible.builtin.copy:
        content: ""
        dest: /etc/modules-load.d/containerd.conf
        force: no

    - name: configure modules for Containerd
      ansible.builtin.blockinfile:
        path: /etc/modules-load.d/containerd.conf
        block: |
             overlay
             br_netfilter

    - name: create an empty file for Kubernetes sysctl params
      ansible.builtin.copy:
        content: ""
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        force: no

    - name: configure sysctl params for Kubernetes
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/99-kubernetes-cri.conf
        line: "{{ item }}"
      with_items:
        - 'net.bridge.bridge-nf-call-iptables  = 1'
        - 'net.ipv4.ip_forward                 = 1'
        - 'net.bridge.bridge-nf-call-ip6tables = 1'

    - name: apply sysctl params without reboot
      ansible.builtin.command: sysctl --system

    - name: install APT Transport HTTPS
      ansible.builtin.apt:
        name: apt-transport-https
        state: present

    # --- Docker/Containerd Installation ---

    - name: add Docker apt-key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker-apt-keyring.asc
        mode: '0644'
        force: true

    - name: add Docker's APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker-apt-keyring.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: install Containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present

    - name: create Containerd directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory

    - name: add Containerd configuration
      ansible.builtin.shell: /usr/bin/containerd config default > /etc/containerd/config.toml

    - name: configuring the systemd cgroup driver for Containerd
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '            SystemdCgroup = false'
        line: '            SystemdCgroup = true'

    - name: enable the Containerd service and start it
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon-reload: yes

    # --- Kubernetes Installation ---

    - name: add Kubernetes apt-key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
        force: true

    - name: add Kubernetes' APT repository
      ansible.builtin.apt_repository:
        # 🟢 FIXED: The repository path is often generalized. Using the standard stable path.
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
        state: present
        update_cache: yes

    - name: install Kubelet
      ansible.builtin.apt:
        # 🟢 FIXED: Using the wildcard format is the most reliable way to install the minor version.
        name: kubelet=1.34.*
        state: present
        update_cache: true

    - name: install Kubeadm
      ansible.builtin.apt:
        # 🟢 FIXED: Using the wildcard format.
        name: kubeadm=1.34.*
        state: present

    - name: enable the Kubelet service, and enable it persistently
      ansible.builtin.service:
        name: kubelet
        enabled: yes

    - name: load br_netfilter kernel module
      ansible.builtin.modprobe:
        name: br_netfilter
        state: present

    - name: set bridge-nf-call-iptables
      ansible.builtin.sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: 1

    - name: set ip_forward
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: 1

    - name: reboot and wait for reboot to complete
      # ⚠️ Skip reboot for local host
      when: inventory_hostname != 'localhost'
      ansible.builtin.reboot:

# Play to install Kubectl on the master node
- hosts: master
  become: yes
  tasks:
    - name: install Kubectl
      ansible.builtin.apt:
        # 🟢 FIXED: Using the wildcard format.
        name: kubectl=1.34.*
        state: present
        force: yes
